name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-hosting-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test public-site behavior
        run: npm test
      - name: Validate JavaScript
        run: npm run check:js
      - name: Refresh sitemap lastmod dates
        run: npm run update:sitemap
      - name: Validate API-backed Blog
        run: npm run validate:blog
      - name: Validate shared header
        run: npm run validate:header-shell
      - name: Validate SEO
        run: npm run validate:seo
      - name: Validate sitemap
        run: npm run validate:sitemap
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUVARNATANTU_VASTRANAND }}
          channelId: live
          projectId: suvarnatantu-vastranand
